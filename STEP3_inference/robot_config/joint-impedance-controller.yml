# Seems smooth enough
# joint_kp: [100., 100., 100., 100., 100., 100., 50.]
# joint_kd: [10., 10., 10., 10., 7.5, 12.0, 5.0]
controller_type: JOINT_POSITION
joint_kp: [50., 50., 50., 50., 50., 50., 25.]
joint_kd: [10., 10., 10., 10., 7.5, 12.0, 5.0]

# # A little bit shaky
# joint_kp: [600., 600., 600., 600., 75., 150., 50.]
# joint_kd: [50., 50., 50., 50., 7.5, 15.0, 5.0]

# original (with critical damping)
# joint_kp: [50., 50., 50., 50., 5., 20., 20.]
# joint_kd: null # [0., 0., 0., 0., 0., 0., 0.]

is_delta: false

traj_interpolator_cfg:
  traj_interpolator_type: LINEAR_JOINT_POSITION
  time_fraction: 0.3

state_estimator_cfg:
  is_estimation: true
  state_estimator_type: EXPONENTIAL_SMOOTHING
  alpha_q: 0.9
  alpha_dq: 0.9
  alpha_eef: 1.0
  alpha_eef_vel: 1.0
