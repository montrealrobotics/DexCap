name: dexcap
channels:
  - conda-forge
  - anaconda

dependencies:
  - python=3.10
  - pip
  - libgcc=5.2.0
  - libstdcxx-ng
  - gcc=12.1.0
  - cmake
  - make
  - git

  - pip:
      - pyzmq
      - PyYAML
      - easydict
      - google-api-python-client
      - pybullet==3.2.7
      - numpy>=2.2.6
      - hidapi
      - glfw
      - numba
      - termcolor
      - simplejson
      - mujoco==3.1.0
      - h5py
      - psutil
      - tqdm
      - tensorboard
      - tensorboardX
      - imageio
      - imageio-ffmpeg
      - matplotlib
      - egl_probe>=1.0.1
      - torch
      - torchvision
      - diffusers==0.11.1
      - einops
      - scipy
      - open3d
      - transforms3d
      - yourdfpy
      - wandb
      - redis
      - robomimic
