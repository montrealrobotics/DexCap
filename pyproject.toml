[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexcap"
version = "0.1.0"
description = "DexCap Teleoperation & Data Collection Suite"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"dexcap" = [
    "configs/**/*.yaml",
    "configs/**/*.npz",
    "robot_descriptions/**/*",
]